spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:agro_manager}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            # URI registrado no Google Console: {FRONTEND_URL}/api/login/oauth2/code/google
            # O Nginx remove o prefixo /api antes de encaminhar ao backend
            redirect-uri: "${FRONTEND_URL}/api/login/oauth2/code/google"

  # ── Thymeleaf ───────────────────────────────────────────────────────────────
  # Usado exclusivamente para renderizar templates de e-mail em src/main/resources/templates/
  # Não interfere nos endpoints REST pois todos os controllers são @RestController
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    # Cache habilitado em produção — templates são compilados apenas uma vez
    cache: true

  # ── E-mail transacional ─────────────────────────────────────────────────────
  # Provedor padrão: Resend (resend.com) — gratuito até 3.000 e-mails/mês
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

server:
  # Necessário para que o Spring resolva corretamente as URLs atrás do Nginx
  # e gere os redirect URIs do OAuth2 com o domínio público correto
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 900000
    refresh-expiration: 604800000
  cors:
    allowed-origins: ${FRONTEND_URL}
  frontend-url: ${FRONTEND_URL}
  mail:
    from-name: ${MAIL_FROM_NAME}
    from-address: ${MAIL_FROM_ADDRESS}


# =============================================================================
# Observabilidade — Actuator + Micrometer Prometheus
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
      base-path: /actuator

  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

  metrics:
    tags:
      application: agro-manager
      environment: production
    distribution:
      # Ativa histogramas para http.server.requests — necessário para que o
      # Prometheus exponha o _bucket e o histogram_quantile funcione no Grafana
      # (p50, p95, p99 por endpoint). Sem esta config apenas count e sum existem.
      percentiles-histogram:
        http.server.requests: true
      # SLOs de latência — cria buckets fixos para facilitar alertas futuros
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s, 2s