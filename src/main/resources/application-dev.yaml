spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agro_manager
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  # ── E-mail transacional ─────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dev}
    password: ${MAIL_PASSWORD:foo}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

app:
  jwt:
    # Mínimo 32 caracteres para HS256 — trocar em produção
    secret: ${JWT_SECRET:dev-only-secret-key-do-not-use-in-production!!}
    expiration: 900000        # 15 minutos em ms
    refresh-expiration: 604800000  # 7 dias em ms
  cors:
    allowed-origins: http://localhost:5173
  frontend-url: http://localhost:5173
  mail:
    from-name: ${MAIL_FROM_NAME:Agro Manager}
    from-address: ${MAIL_FROM_ADDRESS:john.doe@email.com}