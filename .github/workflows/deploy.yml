# =============================================================================
# .github/workflows/deploy.yml — Repositório: agro-manager (backend)
#
# Responsabilidade: build da imagem Docker, push no GHCR e deploy no Lightsail
#
# Trigger: conclusão bem-sucedida do workflow "CI — Backend" na branch master
#   → Garante que o deploy NUNCA ocorre sem os testes passarem
#   → Feature branches e PRs rodam apenas o CI, sem acionar o deploy
#
# Secrets necessários:
#   LIGHTSAIL_HOST     → IP estático do servidor
#   LIGHTSAIL_USER     → ubuntu
#   LIGHTSAIL_SSH_KEY  → conteúdo do arquivo .pem
# =============================================================================

name: Deploy — Backend

on:
  workflow_run:
    # Nome exato do workflow de CI definido em ci.yml
    workflows: ["CI — Backend"]
    branches: [master]
    # Só dispara quando o CI concluir com sucesso
    types: [completed]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agro-manager-backend

jobs:

  # ---------------------------------------------------------------------------
  # Guarda de segurança — cancela toda a execução se o CI falhou
  # Necessário pois o workflow_run não filtra por conclusão automaticamente
  # ---------------------------------------------------------------------------
  check-ci:
    name: Verificar resultado do CI
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: CI passou — prosseguindo com o deploy
        run: echo "CI concluído com sucesso. Iniciando build e deploy."

  # ---------------------------------------------------------------------------
  # Build da imagem Docker e push no GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: check-ci

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        # Faz checkout do commit que disparou o CI (não o HEAD atual)
        # garantindo que buildamos exatamente o código que foi testado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # SHA curto do commit — imutável e rastreável
            type=sha,prefix=,format=short,enable=true
            # latest aponta sempre para o deploy mais recente na master
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds — reduz tempo de compilação Java de ~4min para ~1min
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy no servidor via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no Lightsail
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/agro-manager

            # Autentica no GHCR para pull da imagem privada
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull da nova imagem e restart apenas do backend
            # O frontend continua rodando sem interrupção
            docker compose -f docker-compose.prod.yaml pull backend
            docker compose -f docker-compose.prod.yaml up -d --no-deps backend

            # Remove imagens antigas para liberar espaço no disco de 60 GB
            docker image prune -f

            echo "Deploy concluído: $(date) — commit ${{ github.event.workflow_run.head_sha }}"