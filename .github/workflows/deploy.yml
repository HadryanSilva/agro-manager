# =============================================================================
# .github/workflows/deploy.yml — Repositório: agro-manager (backend)
#
# Responsabilidade: build da imagem Docker, push no GHCR e deploy no Lightsail
#
# Triggers:
#   - push na master  → disparado automaticamente quando um PR é mergeado
#   - workflow_dispatch → disparo manual pela aba Actions do GitHub
#
# Secrets necessários:
#   LIGHTSAIL_HOST     → IP estático do servidor
#   LIGHTSAIL_USER     → ubuntu
#   LIGHTSAIL_SSH_KEY  → conteúdo do arquivo .pem
# =============================================================================

name: Deploy — Backend

on:
  push:
    branches: [master]
    # Não dispara para mudanças que não afetam o código
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/workflows/ci.yml'

  # Permite disparar o deploy manualmente pela aba Actions
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo do deploy manual'
        required: false
        default: 'Deploy manual sem motivo especificado'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agro-manager-backend

jobs:

  # ---------------------------------------------------------------------------
  # Build da imagem Docker e push no GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Exibir informações do disparo
        run: |
          echo "Trigger: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Motivo: ${{ inputs.reason }}"
            echo "Disparado por: ${{ github.actor }}"
          else
            echo "Commit: ${{ github.sha }}"
            echo "Mensagem: ${{ github.event.head_commit.message }}"
          fi

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extrair metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy no servidor via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no Lightsail
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/agro-manager

            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yaml pull backend
            docker compose -f docker-compose.prod.yaml up -d --no-deps backend

            docker image prune -f

            echo "Deploy concluído: $(date)"
            echo "Commit: ${{ github.sha }}"
            echo "Disparado por: ${{ github.actor }}"