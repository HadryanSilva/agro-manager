# =============================================================================
# .github/workflows/deploy.yml — Repositório: agro-manager (backend)
#
# Trigger: push na branch master
# Etapas:  testes → build da imagem Docker → push no GHCR → deploy no Lightsail
#
# Secrets necessários no repositório GitHub:
#   LIGHTSAIL_HOST     → IP estático do servidor
#   LIGHTSAIL_USER     → ubuntu
#   LIGHTSAIL_SSH_KEY  → conteúdo da chave privada
# =============================================================================

name: CI/CD — Backend

on:
  push:
    branches: [master]

env:
  # Nome da imagem no GitHub Container Registry
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agro-manager-backend

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1: Testes de integração com Testcontainers
  # ---------------------------------------------------------------------------
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Permissão no Gradle wrapper
        run: chmod +x gradlew

      - name: Executar testes
        # Testcontainers sobe um PostgreSQL real via Docker do runner
        run: ./gradlew test --no-daemon

      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/

  # ---------------------------------------------------------------------------
  # JOB 2: Build da imagem Docker e push no GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    outputs:
      # Passa o SHA da imagem para o job de deploy garantir imutabilidade
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx (build multiplataforma)
        uses: docker/setup-buildx-action@v3

      - name: Extrair metadados da imagem (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag com o SHA curto do commit (imutável, rastreável)
            type=sha,prefix=,format=short
            # Tag latest sempre aponta para o commit mais recente da master
            type=raw,value=latest

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache entre builds para acelerar compilação Java
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # JOB 3: Deploy no servidor via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy no Lightsail
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          # Timeout generoso para o docker pull da imagem Java (~300 MB)
          command_timeout: 10m
          script: |
            set -e

            cd ~/agro-manager

            # Autentica no GHCR para fazer pull da imagem privada
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Atualiza apenas o backend sem derrubar o frontend
            docker compose -f docker-compose.prod.yaml pull backend
            docker compose -f docker-compose.prod.yaml up -d --no-deps backend

            # Remove imagens antigas para liberar espaço em disco
            docker image prune -f

            echo "Deploy do backend concluído: $(date)"