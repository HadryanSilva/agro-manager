# =============================================================================
# .github/workflows/ci.yml — Repositório: agro-manager (backend)
#
# Responsabilidade: compilação e testes de integração
#
# Trigger:
#   - pull_request de develop → master
#     Bloqueia o merge caso os testes falhem, garantindo que apenas
#     código validado chegue à master e dispare o deploy.
#
# NÃO faz deploy — apenas garante que o código está correto.
# O deploy é disparado automaticamente pelo workflow deploy.yml
# quando o merge na master é concluído.
# =============================================================================

name: CI — Backend

on:
  pull_request:
    branches: [master]
    # Filtra apenas PRs originados da branch develop
    # PRs de outras branches não disparam este workflow
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:

  # Garante que o workflow só executa quando o PR vem da branch develop
  check-branch:
    name: Verificar branch de origem
    runs-on: ubuntu-latest
    steps:
      - name: Validar branch de origem
        if: ${{ github.head_ref != 'develop' }}
        run: |
          echo "Este workflow só executa em PRs originados da branch develop."
          echo "Branch detectada: ${{ github.head_ref }}"
          exit 1

  test:
    name: Testes de integração
    runs-on: ubuntu-latest
    needs: check-branch

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          # Cache do Gradle entre execuções para acelerar o download de dependências
          cache: gradle

      - name: Permissão no Gradle wrapper
        run: chmod +x gradlew

      - name: Executar testes
        # Testcontainers sobe um PostgreSQL real via Docker do runner
        run: ./gradlew test --no-daemon

      - name: Publicar relatório de testes
        # Sempre publica, mesmo quando os testes falham, para facilitar diagnóstico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: build/reports/tests/
          retention-days: 7